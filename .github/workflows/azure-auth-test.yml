name: Test Azure Authentication

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show current account
        run: |
          az account show --output table

      - name: Check Resource Group
        run: |
          az group show \
            --name calss-9am \
            --output table
