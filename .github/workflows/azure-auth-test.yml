name: Test Azure Authentication

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show authenticated account
        run: |
          az account show \
            --query "{subscription:name, subscriptionId:id, tenantId:tenantId, identity:user.name}" \
            --output table
